theme = "test"

#---- Editor ----#
[editor]
popup-border = "all"
bufferline = "multiple"
color-modes = true

[editor.cursor-shape]
insert = "bar"

# [editor.whitespace]
# render = "all"
# or control each character
[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "none"
nnbsp = "none"
newline = "none"
[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·" # Tabs will look like "→···" (depending on tab width)

[editor.inline-diagnostics]
cursor-line = "hint" # `disable`, `hint`, `info`, `warning`, `error`

#---- Keymaps ----#
[keys.normal.m]
'"' = '@f";lmi"'
"'" = "@f';lmi'"
"(" = '@f(;lmi('
"[" = '@f[;lmi['
"{" = '@f{;lmi{'

[keys.insert.j]
j = "normal_mode"
